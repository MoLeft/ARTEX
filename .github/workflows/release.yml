name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的提交标签，例如 v0.26.11.01.004 或 v0.26.11.01.004-beta"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      beta: ${{ steps.version.outputs.beta }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v0\.([0-9]{2})\.([0-9]{2})\.([0-9]{2})\.([0-9]{3})(-beta([1-9][0-9]*)?)?$ ]]; then
            echo "版本标签须为 v0.YY.MM.DD.SSS[-beta]" >&2
            exit 1
          fi
          date_text="20${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-${BASH_REMATCH[3]}"
          if [ "${BASH_REMATCH[4]}" = "000" ] || [ "$(date -u -d "$date_text" +%F 2>/dev/null)" != "$date_text" ]; then
            echo "版本日期无效，或提交序号为 000" >&2
            exit 1
          fi
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "请先配置 Actions Secrets DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" == *-beta* ]]; then echo "beta=true" >> "$GITHUB_OUTPUT"; else echo "beta=false" >> "$GITHUB_OUTPUT"; fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          fetch-depth: 0
      - name: Match tag to its commit version
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git rev-list --first-parent origin/main | grep -Fxq "$(git rev-parse HEAD)"; then
            echo "只能发布 main 主线上的提交" >&2
            exit 1
          fi
          base="${RELEASE_TAG%-beta*}"
          expected="$(./version.sh HEAD)"
          if [ "$base" != "$expected" ]; then
            echo "标签编号 $base 与此提交应有的 $expected 不符" >&2
            exit 1
          fi
          for tag in $(git tag --list "$base" "$base-beta*"); do
            if [ "$tag" != "$RELEASE_TAG" ]; then
              echo "提交编号 $base 已被标签 $tag 使用" >&2
              exit 1
            fi
          done
      - name: Pin release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex-ci-test
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # shortcut: server's database-backed suite has baseline failures; Docker smoke still checks database startup.
      - run: go test -p 1 $(go list ./... | grep -v '/server$')
      - run: go test ./server -run '^(TestTOTPMatchesRFCVectorAndTimeWindow|TestLoginTOTPRequirementFailsClosed|TestTOTPSecretEncryptionRejectsTampering|TestLightpandaReadToolBoundary|TestLightpandaRuntimeMCPFollowsVersionState)$'
      - name: Test finding counts and proxy recovery
        env:
          ARTEX_PG_DSN: postgres://artex:artex-ci-test@127.0.0.1:5432/artex?sslmode=disable
        run: |
          go test ./db -run '^TestMissingSkillStatsPageCountsBeyondFirstPage$' -count=1
          go test ./server -run '^(TestProxy|TestDashboardActivityUsesLatestPage|TestSummaryAndReportBeyondListLimits|TestFindingStatsBeyondLegacyListLimit|TestTaskFindingsPageIncludesAllNodesAndProtectsSources|TestMissingSkillAPIReportsWholeLedger|TestInheritedActivityDetailAndRelationDeletion)$' -count=1 -p 1
      - name: Test built-in MCP controls
        env:
          ARTEX_PG_DSN: postgres://artex:artex-ci-test@127.0.0.1:5432/artex?sslmode=disable
          ARTEX_TEST_MCP_CONTROLS: "1"
        run: go test ./server -run '^TestBuiltinMCPControls$' -count=1

  # ① 前端静态导出（一次），产物给交叉编译各平台复用
  frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # ② 五平台交叉编译（内嵌前端）+ 打 zip
  binaries:
    needs: [prepare, frontend, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ needs.prepare.outputs.tag }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # UPX 自解压 ELF 在部分 Linux 内核、虚拟化和安全策略下会崩溃。
          # Release 使用 Go linker 裁剪和 zip 压缩，优先保证可移植性。
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
      # Linux 生二进制单独上传，供 docker job 复用（免在镜像里重编前端+Go）
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/artex-linux-${{ matrix.goarch }}/artex

  # ③ 汇总所有 zip → 创建 GitHub Release
  release:
    needs: [prepare, binaries, docker-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: |
          version="${RELEASE_TAG#v}"
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            test -s "artex-${version}-${target}.zip"
          done
          sha256sum *.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Refuse to overwrite a published release
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/artex-release.json 2>/tmp/artex-release.err; then
            draft=$(jq -r .isDraft /tmp/artex-release.json)
            if [[ "$draft" != "true" ]]; then
              echo "该版本已发布，拒绝覆盖；请创建更高版本的标签" >&2
              exit 1
            fi
          elif ! grep -qi 'release not found\|HTTP 404' /tmp/artex-release.err; then
            cat /tmp/artex-release.err >&2
            exit 1
          fi
      - name: List changes since the previous published release
        run: |
          previous=""
          while IFS= read -r tag; do
            if git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null && git merge-base --is-ancestor "$tag" "HEAD^1"; then
              previous="$tag"
              break
            fi
          done < <(gh api "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name')
          if [ -z "$previous" ]; then
            echo "找不到上一已发布版本，无法生成完整更新内容" >&2
            exit 1
          fi
          {
            printf 'Docker Hub 镜像：`moleftcn/artex:%s`。正式版同时更新 `latest`。\n\n' "$RELEASE_TAG"
            printf '支持 Linux AMD64 / ARM64，Docker 会自动选择宿主机架构。程序包提供 Linux、macOS 的 AMD64 / ARM64 及 Windows AMD64，并附 SHA256SUMS。\n\n'
            printf '### 自 %s 以来的提交\n\n' "$previous"
            while IFS=$'\t' read -r commit subject; do
              printf -- '- `%s` %s (`%.7s`)\n' "$(./version.sh "$commit")" "$subject" "$commit"
            done < <(git log --first-parent --reverse --format='%H%x09%s' "$previous..HEAD")
            printf '\n部署和在线更新说明见本仓库 README。\n'
          } > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          draft: true
          prerelease: ${{ needs.prepare.outputs.beta == 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/SHA256SUMS
          body_path: release-notes.md
      - name: Publish complete release
        env:
          BETA: ${{ needs.prepare.outputs.beta }}
        run: |
          if [ "$BETA" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi

  # GITHUB_TOKEN 发布的 Release 不会再次触发 release: published 工作流。
  # 直接依赖发布 job，保证 ZIP、校验文件和镜像全部发布成功后才更新 Demo。
  demo:
    needs: [prepare, release]
    if: ${{ needs.prepare.outputs.beta == 'false' && vars.VERCEL_ORG_ID != '' && vars.VERCEL_PROJECT_ID != '' && vars.DEMO_URL != '' }}
    uses: ./.github/workflows/demo.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      commit: ${{ needs.prepare.outputs.commit }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  # ④ 在原生 AMD64 / ARM64 runner 上构建和测试，再推送架构镜像。
  docker:
    needs: [prepare, binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex-ci-test
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4 # 取 Dockerfile 与 skills/
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image for native smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: artex:smoke
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: Test application startup and embedded frontend
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          docker run --rm --entrypoint /app/artex artex:smoke -h
          docker run -d --name artex-smoke --network host \
            -e ARTEX_PG_DSN='postgres://artex:artex-ci-test@127.0.0.1:5432/artex?sslmode=disable' artex:smoke
          trap 'docker logs artex-smoke; docker rm -f artex-smoke' EXIT
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 --max-time 3 \
            http://127.0.0.1:8787/api/health > /tmp/artex-health.json
          jq -e --arg version "$RELEASE_TAG" '.ok == true and .version == $version' /tmp/artex-health.json
          docker exec artex-smoke curl --fail --silent --show-error --max-time 5 \
            http://127.0.0.1:9222/mcp \
            -H 'Accept: application/json, text/event-stream' -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"artex-smoke","version":"1"}}}' \
            | jq -e '.result.serverInfo.name == "lightpanda"'
          curl --fail http://127.0.0.1:8787/ > /tmp/artex-index.html
          grep -qi '<!doctype html' /tmp/artex-index.html
      - name: Push tested architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: moleftcn/artex:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha,scope=docker-${{ matrix.arch }}

  # ⑤ 两种架构都通过启动验证后发布版本镜像；正式版再更新 latest。
  docker-publish:
    needs: [prepare, docker]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish multi-platform image
        env:
          IMAGE: moleftcn/artex
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          BETA: ${{ needs.prepare.outputs.beta }}
        run: |
          tags=(--tag "$IMAGE:$RELEASE_TAG")
          if [ "$BETA" = false ]; then tags+=(--tag "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$RELEASE_TAG-amd64" "$IMAGE:$RELEASE_TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --raw > /tmp/artex-manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | index("amd64") != null and index("arm64") != null' /tmp/artex-manifest.json
